[platformio]
default_envs = esp32l_f53_demo
src_dir = src
include_dir = include

[env:esp32l_f53_demo]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@1.6.9
  adafruit/Adafruit GFX Library@1.13.0
build_flags = -D TAB_DEMO_FIRMWARE=1
