<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moonshot Academy Campus</title>
    <meta name="description" content="Moonshot Academy Campus：在 3D 校园地图上找到教室、书院、实验室和正在发生的活动。" />
    <meta name="theme-color" content="#e3e7eb" />
    <meta property="og:title" content="Moonshot Academy Campus" />
    <meta property="og:description" content="在 3D 校园地图上找到教室、书院、实验室和正在发生的活动。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/mac-logo.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Fonts are served from this site (Google Fonts is unreachable in mainland China and for some networks). -->
    <link rel="preload" href="/fonts/unbounded-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hanken-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/unbounded-600.woff2) format("woff2"); unicode-range: U+20, U+2D, U+30-39, U+41-5A, U+61-7A; }
      /* Startup screen, painted from HTML alone before any JavaScript runs: the name fades in.
         Opacity and transform only, so it stays smooth while the main thread loads the 3D map. */
      #boot-splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(ellipse 75% 70% at 50% 46%, #f3f5f8 0%, #e3e7eb 58%, #cfd6de 100%); transition: opacity 700ms cubic-bezier(0.22, 1, 0.36, 1); color: #18202e; }
      #boot-splash[data-state="gone"] { opacity: 0; pointer-events: none; }
      #boot-splash .name { margin: 0; padding: 0 24px; text-align: center; font-family: "Unbounded", "Hanken Grotesk", "PingFang SC", system-ui, sans-serif; font-weight: 600; font-size: clamp(22px, 3.4vw, 40px); letter-spacing: -0.01em; line-height: 1.2; opacity: 0; transform: translateY(6px); will-change: opacity, transform; }
      /* Starts once the display font is ready (or after 700 ms), so the letters never swap mid-fade. */
      #boot-splash.ready .name { animation: boot-name 1400ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #boot-splash[data-state="gone"] .name { transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1); transform: translateY(-4px); }
      #boot-splash .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes boot-name { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash.ready .name { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <p class="name">Moonshot Academy Campus</p>
      <p class="hint sr">正在载入校园地图</p>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-splash');
        var go = function () { if (!window.__bootNameAt) { window.__bootNameAt = performance.now(); el.classList.add('ready'); } };
        // Start the fade when the display font is ready (preloaded from this site, usually < 100 ms).
        setTimeout(go, 700);
        if (document.fonts && document.fonts.load) document.fonts.load('600 1em Unbounded', 'MoonshotAcademyCampus').then(go, go);
        else go();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
