<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moonshot Academy Campus</title>
    <meta name="description" content="Moonshot Academy Campus：在 3D 校园地图上找到教室、书院、实验室和正在发生的活动。" />
    <meta name="theme-color" content="#e3e7eb" />
    <meta property="og:title" content="Moonshot Academy Campus" />
    <meta property="og:description" content="在 3D 校园地图上找到教室、书院、实验室和正在发生的活动。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/mac-logo.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; system fonts show until they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <link id="font-display" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap&text=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-%20" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap" />
    </noscript>
    <style>
      /* Startup screen, painted from HTML alone before any JavaScript runs: the name fades in.
         Opacity and transform only, so it stays smooth while the main thread loads the 3D map. */
      #boot-splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(ellipse 75% 70% at 50% 46%, #f3f5f8 0%, #e3e7eb 58%, #cfd6de 100%); transition: opacity 700ms cubic-bezier(0.22, 1, 0.36, 1); color: #18202e; }
      #boot-splash[data-state="gone"] { opacity: 0; pointer-events: none; }
      #boot-splash .name { margin: 0; padding: 0 24px; text-align: center; font-family: "Unbounded", "Hanken Grotesk", "PingFang SC", system-ui, sans-serif; font-weight: 600; font-size: clamp(22px, 3.4vw, 40px); letter-spacing: -0.01em; line-height: 1.2; opacity: 0; transform: translateY(6px); will-change: opacity, transform; }
      /* Starts once the display font is ready (or after 600 ms), so the letters never swap mid-fade. */
      #boot-splash.ready .name { animation: boot-name 1400ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #boot-splash[data-state="gone"] .name { transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1); transform: translateY(-4px); }
      #boot-splash .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes boot-name { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash.ready .name { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <p class="name">Moonshot Academy Campus</p>
      <p class="hint sr">正在载入校园地图</p>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-splash');
        var go = function () { if (!window.__bootNameAt) { window.__bootNameAt = performance.now(); el.classList.add('ready'); } };
        setTimeout(go, 450);
        // Wait for the display font itself (its stylesheet loads asynchronously), then start the fade.
        var link = document.getElementById('font-display');
        var whenFont = function () {
          if (!document.fonts || !document.fonts.load) return go();
          document.fonts.load('600 1em Unbounded', 'MoonshotAcademyCampus').then(function (faces) { if (faces.length) go(); }, go);
        };
        if (link && link.rel === 'stylesheet') whenFont(); else if (link) link.addEventListener('load', function () { setTimeout(whenFont, 0); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
