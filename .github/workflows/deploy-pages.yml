name: Deploy MAC to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Explain missing Cloudflare credential
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo 'Cloudflare deployment was not run. Add the CLOUDFLARE_API_TOKEN repository secret to enable deployment.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to the existing Cloudflare Pages project
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 23eaec5f0fa05be152e061ee451a5fd8
          command: pages deploy dist --project-name=mac --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
